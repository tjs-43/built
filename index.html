async function out(f){if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]})}catch(e){}return}const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click()}

 try{const im=new Image();await new Promise((ok,no)=>{im.onload=ok;im.onerror=no;im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(r.svg)});
 const c=document.createElement('canvas');c.width=1020;c.height=r.H*2;c.getContext('2d').drawImage(im,0,0,1020,r.H*2);
 const b=await new Promise(ok=>c.toBlob(ok,'image/png'));await out(new File([b],'weekly-lifts-report.png',{type:'image/png'}))}catch(e){msg='Could not build the report.';render()}}

function render(){if(tab==='log'&&db.a){ed=db.a;hist=false}else if(tab!=='hist')ed=null;
 $('#v').innerHTML=tab==='log'?(ed?editor():home()):tab==='hist'?(ed?editor():histl()):tab==='prog'?prog():tab==='bw'?bwt():data();

document.addEventListener('click',async ev=>{const b=ev.target.closest('[data-a]');if(!b)return;if(b.classList.contains('sl')){if(Date.now()-sup<400)return;if(b.classList.contains('o')){b.style.transform='';b.classList.remove('o');return}}const D=b.dataset,i=+D.i,j=+D.j,a=D.a,ps=()=>{if(!hist)save()};
 if(a==='ck'){const s=ed.x[i].s[j];s.d=!s.d;if(s.d){if(s.w==='')s.w=s.pw??'';if(s.r==='')s.r=s.pr??'';const n=b.parentNode.querySelectorAll('input');n[0].value=s.w;n[1].value=s.r}b.textContent=s.d?'✓':'○';b.parentNode.classList.toggle('d',s.d);ps();return}
 if(a==='tab'){tab=D.k;ed=null;hist=false;pe=null;msg=''}
 else if(a==='st')start(i>=0?db.t[i]:null);

 else if(a==='rx'){ed.x.splice(i,1);ps()}

 else if(a==='as'){const s=ed.x[i].s,q=s[s.length-1]||{};s.push({w:'',r:'',i:'',pw:q.w!==''&&q.w!=null?q.w:(q.pw??''),pr:q.r!==''&&q.r!=null?q.r:(q.pr??''),d:false});ps()}
 else if(a==='fin'){const w=clean(ed);if(!w.x.length){alert('Enter or tick at least one set first.');return}const t=(Date.now()-ed.t0)/1000;w.u=t<21600?Math.round(t):null;db.w.push(w);db.a=null;ed=null;save()}
 else if(a==='ds'){if(confirm('Discard this workout?')){db.a=null;ed=null;save()}else return}
 else if(a==='tp'){const n=prompt('Template name',ed.n);if(n){db.t.push({id:uid(),n,x:ed.x.map(e=>({n:e.n,k:e.s.length}))});save();alert('Template saved')}return}
 else if(a==='oh'){const w=db.w.find(w=>w.id===D.id);ed=JSON.parse(JSON.stringify(w));hist=true}
 else if(a==='hs'){const w=clean(ed),k=db.w.findIndex(x=>x.id===w.id);db.w[k]=w;ed=null;hist=false;save()}
 else if(a==='hd'){if(confirm('Delete this workout?')){db.w=db.w.filter(w=>w.id!==ed.id);ed=null;hist=false;save()}else return}
 else if(a==='dh'){db.w=db.w.filter(w=>w.id!==D.id);save()}
 else if(a==='rp'){await rep();return}
 else if(a==='ps'){pe={i,d:JSON.parse(JSON.stringify(db.pp[i]||[]))};msg=''}
 else if(a==='sa'){const s={n:px,m:pm};if(!pe.d.some(x=>x.n===s.n&&x.m===s.m)){if(pe.d.length>=5)msg='Up to 5 lines per plot.';else if(new Set([...pe.d,s].map(x=>UN()[x.m])).size>2)msg='A plot can show at most two different units.';else{pe.d.push(s);msg=''}}}
 else if(a==='sx'){pe.d.splice(i,1)}
 else if(a==='sc'){pe.d=[]}
 else if(a==='pok'){while(db.pp.length<=pe.i)db.pp.push([]);db.pp[pe.i]=pe.d;pe=null;msg='';save()}
 else if(a==='pcx'){pe=null;msg=''}
 else if(a==='rn'){const o=D.n,v=(prompt('Rename "'+o+'" to',o)||'').trim();if(!v||v===o)return;const x=names().find(n=>n!==o&&n.toLowerCase()===v.toLowerCase());if(x&&!confirm('Merge into your existing "'+x+'"?'))return;ren(o,x||v);msg='Renamed to "'+(x||v)+'".'}
 else if(a==='hc'){ed=null;hist=false}
 else if(a==='ex'){await exp();return}
 else if(a==='exw'){await out(new File(['Date,Body Weight\n'+bws().map(e=>e.d+','+e.v).join('\n')],'body-weight.csv',{type:'text/csv'}));return}
 else if(a==='bs'){const d=$('#bd').value,v=parseFloat($('#bv').value);if(!d||!(v>0))msg='Enter a date and a weight.';else{bwset(d,v);save();msg='Saved '+v+' '+U()+' for '+d+'.'}}
 else if(a==='bxd'){db.bw=db.bw.filter(e=>e.d!==D.d);save()}
 render()});
document.addEventListener('input',ev=>{const t=ev.target,f=t.dataset.f;if(!f||!ed)return;if(f==='name')ed.n=t.value;else ed.x[+t.dataset.i].s[+t.dataset.j][f]=t.value;if(!hist)save()});

 if(f==='px'||f==='pm'){if(f==='px')px=t.value;else pm=t.value;render()}

 if(t.id==='f'&&t.files[0]){msg=imp(await t.files[0].text());render()}});
function csv(t){const r=[];let a=[],c='',q=0;for(let i=0;i<t.length;i++){const h=t[i];if(q){if(h==='"'){if(t[i+1]==='"'){c+='"';i++}else q=0}else c+=h}else if(h==='"')q=1;else if(h===','){a.push(c);c=''}else if(h==='\n'||h==='\r'){if(h==='\r'&&t[i+1]==='\n')i++;a.push(c);c='';r.push(a);a=[]}else c+=h}if(c||a.length){a.push(c);r.push(a)}return r}
function dur(s){if(!s)return null;const g=r=>+((s.match(r)||[])[1]||0),t=g(/(\d+)h/)*3600+g(/(\d+)m/)*60+g(/(\d+)s/);return t&&t<21600?t:null}
function imp(t){const r=csv(t.replace(/^\uFEFF/,'')),h=r.shift().map(s=>s.trim()),ix=n=>h.indexOf(n),need=['Date','Exercise Name','Weight','Reps'].filter(n=>ix(n)<0);
 if(h.includes('Body Weight')){let n=0;r.forEach(a=>{const v=parseFloat(a[h.indexOf('Body Weight')]),d=(a[0]||'').slice(0,10);if(d&&v>0){bwset(d,v);n++}});save();return`Imported ${n} body weight entries.`}
 if(need.length)return'This does not look like a Strong export. Missing columns: '+need.join(', ');
 const m=new Map();r.forEach(a=>{const d=a[ix('Date')];if(!d||a.length<h.length)return;let w=m.get(d);if(!w){w={id:uid(),d,n:a[ix('Workout Name')]||'Workout',u:dur(a[ix('Duration')]),x:[]};m.set(d,w)}
  const en=a[ix('Exercise Name')];let e=w.x.find(e=>e.n===en);if(!e){e={n:en,s:[]};w.x.push(e)}const rp=parseFloat(a[ix('RPE')]),q={w:+a[ix('Weight')]||0,r:+a[ix('Reps')]||0};if(rp>0)q.i=Math.max(0,10-rp);e.s.push(q)});
 const have=new Set(db.w.map(w=>w.d));let n=0;m.forEach(w=>{if(!have.has(w.d)){db.w.push(w);n++}});save();return`Imported ${n} workouts. ${m.size-n} were already stored.`}
async function exp(){const q=v=>/[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v,L=['Date,Workout Name,Duration,Exercise Name,Set Order,Weight,Reps,Distance,Seconds,RPE'];
 ws().reverse().forEach(w=>w.x.forEach(e=>e.s.forEach((s,i)=>L.push([w.d,q(w.n),fmtDur(w.u),q(e.n),i+1,s.w,s.r,0,0,s.i!=null?10-s.i:''].join(',')))));
 await out(new File([L.join('\n')],'lifts.csv',{type:'text/csv'}))}
